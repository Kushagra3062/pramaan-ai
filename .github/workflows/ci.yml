name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pramaan
          POSTGRES_PASSWORD: pramaan_local_only
          POSTGRES_DB: pramaan_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pramaan -d pramaan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://pramaan:pramaan_local_only@127.0.0.1:5433/pramaan_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Install Tesseract OCR (eng + mal)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-mal
      - name: Lint
        run: ruff check app tests scripts
      - name: Apply disposable test schema
        run: alembic upgrade head
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
