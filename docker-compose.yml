services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pramaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan_local_only
      POSTGRES_DB: pramaan_dev
    ports:
      - "5433:5432"
    volumes:
      - pramaan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pramaan_pgdata:
